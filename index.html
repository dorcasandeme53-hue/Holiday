<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacances à Bordeaux</title>
<style>
:root{--bg:#FBF3E8;--card:#FFFFFF;--ink:#2B1B17;--muted:#7A6559;--accent:#C8412F;--green:#1F7A5C;--soft:#E9F4EE;--line:#EADCC9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1E1411;--card:#2D1F1A;--ink:#FBF3E8;--muted:#BFA899;--accent:#E8795F;--green:#5CC49D;--soft:#1E3A2F;--line:#45322B;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 56px}
header{text-align:center;padding:12px 0 8px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1.15;margin:6px 0 4px}
.sub{color:var(--muted);margin:0;font-size:15px}
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:18px 0 8px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.track{stroke:var(--line)}
.bar{stroke:var(--green);transition:stroke-dashoffset .6s ease}
.hero h2{font-size:18px;margin:0 0 4px}
.hero p{margin:0;color:var(--muted);font-size:15px}
.addbtn{width:100%;margin:12px 0 0;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#form{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
#form label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
#form input,#form select,#form textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#form .two{display:grid;grid-template-columns:70px 1fr;gap:10px}
#form .btns{display:flex;gap:10px;margin-top:14px}
.ok{flex:1;background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}
section h3{font-family:Georgia,serif;font-size:21px;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
section h3 small{font-family:-apple-system,Arial,sans-serif;font-size:13px;color:var(--muted);font-weight:600}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 10px;overflow:hidden;transition:background .25s,border-color .25s}
.item.done{background:var(--soft);border-color:var(--green)}
.cover{display:block;width:100%;height:150px;object-fit:cover}
.main{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;color:var(--ink);border:0;padding:14px 14px 8px;font:inherit;cursor:pointer}
.main:active{opacity:.7}
.emoji{font-size:30px;line-height:1;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px}
.txt{flex:1;min-width:0}
.name{font-weight:700;font-size:17px;display:block;overflow-wrap:anywhere}
.item.done .name{text-decoration:line-through;text-decoration-thickness:2px;opacity:.65}
.desc{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--soft);padding:3px 9px;border-radius:99px;overflow-wrap:anywhere}
.item.done .tag{background:var(--card)}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;transition:all .25s;margin-top:2px}
.item.done .box{background:var(--green);border-color:var(--green);color:#fff}
.acts{display:flex;gap:8px;padding:0 14px 12px 72px;flex-wrap:wrap}
.acts a,.acts button{font:inherit;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px;text-decoration:none;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
footer{text-align:center;margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.note{width:100%;color:var(--muted);font-size:12.5px;margin:6px 0 0}
.pop{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<main>
<header>
<p class="eyebrow">Programme des vacances</p>
<h1>Bordeaux, 10 jours 🎄</h1>
<p class="sub">Cochez, ajoutez vos idées, suivez la progression.</p>
</header>
<div class="hero">
<div class="ring">
<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle class="track" cx="48" cy="48" r="40" fill="none" stroke-width="10"/><circle id="bar" class="bar" cx="48" cy="48" r="40" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg>
<div class="num" id="pct">0%</div>
</div>
<div><h2 id="count">…</h2><p id="msg"></p></div>
</div>
<button class="addbtn" id="addbtn" type="button">＋ Ajouter une idée</button>
<div id="form">
<label for="f-name">Quoi ?</label>
<input id="f-name" maxlength="80" placeholder="Ex. Musée d’Aquitaine">
<div class="two"><div><label for="f-emoji">Emoji</label><input id="f-emoji" maxlength="4" placeholder="auto"></div>
<div><label for="f-place">Lieu</label><input id="f-place" maxlength="80" placeholder="Ex. Place de la Bourse"></div></div>
<label for="f-note">Note</label>
<textarea id="f-note" rows="2" maxlength="200" placeholder="Pour ne pas oublier…"></textarea>
<label for="f-group">Catégorie</label>
<select id="f-group"><option value="idees">Idée en plus</option><option value="sorties">Sortie</option><option value="noel">Noël</option><option value="restos">Resto</option></select>
<label for="f-photo">Photo (facultatif)</label><input id="f-photo" type="file" accept="image/*">
<div class="btns"><button class="ok" id="f-ok" type="button">Ajouter</button><button class="ghost" id="f-cancel" type="button">Annuler</button></div>
</div>
<div id="list"></div>
<footer>
<button class="ghost" id="share" type="button">🔗 Partager ma liste</button>
<button class="ghost" id="reset" type="button">Tout décocher</button>
<p class="note">Ta liste est enregistrée sur ce téléphone. Pour la donner à ta sœur, envoie-lui le lien de partage.</p>
</footer>
</main>
<script>
var GROUPS=[["sorties","Détente & évasion"],["noel","Ambiance de Noël"],["restos","Où manger"],["idees","Nos idées en plus 💡"]];
var DEFAULTS=[
["sorties","🧖","Calicéo Bruges","2h de détente au spa pour se relaxer.","Bordeaux · Bruges","Calicéo Bruges"],
["sorties","🦅","Spectacle des aigles","Démonstration de rapaces, à faire avec la dune.","Arcachon · env. 1h de Bordeaux","Spectacle des aigles Arcachon"],
["sorties","🏜️","Dune du Pilat","Montée de la dune et vue sur le bassin. Pars tôt.","Même journée qu’Arcachon","Dune du Pilat"],
["sorties","🎬","Cinéma","Une séance en fin de journée, film à choisir.","Bordeaux","Cinéma Bordeaux"],
["noel","🛍️","Shopping de Noël","Black Friday le 27 novembre : les cadeaux à prix réduits.","Centre-ville","Rue Sainte-Catherine Bordeaux"],
["noel","🎄","Marché de Noël","Chichis, ambiance et illuminations.","Allées de Tourny · dates à vérifier","Marché de Noël allées de Tourny Bordeaux"],
["noel","⛸️","Patinoire","À enchaîner avec le marché de Noël.","Bordeaux · dates à vérifier","Patinoire de Noël Bordeaux"],
["restos","🍔","Burger américain","Un bon burger dans le quartier.","Vers Sainte-Catherine","Burger rue Sainte-Catherine Bordeaux"],
["restos","🥞","Crêpes bretonnes","Galettes salées et crêpes sucrées.","Vers Sainte-Catherine","Crêperie rue Sainte-Catherine Bordeaux"],
["restos","🧇","Gaufres avocat-saumon","Au restaurant Crêpe Touch.","Bordeaux Lac · Crêpe Touch","Crêpe Touch Bordeaux Lac"],
["restos","🥘","Tajheen","Un repas autour du tajine.","Bordeaux","Tajheen Bordeaux"],
["restos","🍝","Osteria Palatino","Le repas italien du séjour.","Bordeaux","Osteria Palatino Bordeaux"]];
var KEYS=[["spa","🧖"],["musee","🏛️"],["cine","🎬"],["plage","🏖️"],["dune","🏜️"],["shopping","🛍️"],["boutique","🛍️"],["parc","🌳"],["jardin","🌳"],["balade","🚶"],["cafe","☕"],["the ","☕"],["bar ","🍹"],["cocktail","🍹"],["marche","🎄"],["patin","⛸️"],["burger","🍔"],["pizza","🍕"],["crepe","🥞"],["gaufre","🧇"],["glace","🍦"],["resto","🍽️"],["manger","🍽️"],["bowling","🎳"],["escape","🔐"],["concert","🎵"],["theatre","🎭"],["vin","🍷"]];
var GEMO={sorties:"✨",noel:"🎁",restos:"🍽️",idees:"💡"};
var K="vacances-bordeaux-items-v2",items=load();
function $(i){return document.getElementById(i)}
function load(){
 try{var a=JSON.parse(localStorage.getItem(K)||"null");if(a&&a.length)return a}catch(e){}
 return DEFAULTS.map(function(d,i){return{id:"d"+i,group:d[0],order:i,emoji:d[1],name:d[2],desc:d[3],tag:d[4],q:d[5],done:false}});
}
function save(){try{localStorage.setItem(K,JSON.stringify(items))}catch(e){alert("Mémoire pleine : supprime une photo.")}render()}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function autoEmoji(t,g){var n=norm(t)+" ";for(var i=0;i<KEYS.length;i++){if(n.indexOf(KEYS[i][0])>-1)return KEYS[i][1]}return GEMO[g]||"💡"}
function uid(){return "i"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function mapUrl(q){q=q||"";if(!/bordeaux|arcachon|pilat|pyla/i.test(q))q+=" Bordeaux";return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function msgFor(n,t){if(t===0)return "Rien pour l’instant.";if(n===0)return "C’est parti !";if(n===t)return "Programme terminé, bravo ! 🎉";if(n>=t*0.75)return "Presque fini, plus que quelques-uns !";if(n>=t/2)return "Déjà la moitié, bien joué !";return "Bon début, continuez comme ça."}
function confetti(){var e=["🎄","✨","🎁","⛸️","🍽️","❄️"];for(var k=0;k<24;k++){var s=document.createElement("span");s.className="pop";s.textContent=e[k%e.length];s.style.left=(Math.random()*95)+"vw";s.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(s);setTimeout((function(x){return function(){x.remove()}})(s),2800)}}
function resize(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var r=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.7))};img.onerror=function(){res(null)};img.src=u})}
function pickPhoto(it){var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=function(){if(inp.files[0])resize(inp.files[0]).then(function(d){if(d){it.photo=d;save()}})};inp.click()}
function toggle(it){it.done=!it.done;save();if(it.done&&items.every(function(x){return x.done}))confetti()}
function render(){
 var host=$("list");host.textContent="";
 var done=items.filter(function(x){return x.done}).length,tot=items.length;
 $("pct").textContent=(tot?Math.round(done/tot*100):0)+"%";
 $("count").textContent=done+" / "+tot+" faits";
 $("msg").textContent=msgFor(done,tot);
 $("bar").style.strokeDashoffset=251.3*(1-(tot?done/tot:0));
 if(!tot){var e=document.createElement("p");e.className="empty";e.textContent="Aucune idée pour l’instant. Ajoutez la première !";host.appendChild(e)}
 GROUPS.forEach(function(g){
  var list=items.filter(function(x){return x.group===g[0]}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  if(!list.length)return;
  var sec=document.createElement("section"),h=document.createElement("h3"),sm=document.createElement("small");
  h.textContent=g[1];sm.textContent=list.filter(function(x){return x.done}).length+" / "+list.length;h.appendChild(sm);sec.appendChild(h);
  list.forEach(function(it){
   var card=document.createElement("div");card.className="item"+(it.done?" done":"");
   if(it.photo&&it.photo.indexOf("data:image/jpeg")===0){var im=document.createElement("img");im.className="cover";im.alt="Photo : "+(it.name||"");im.src=it.photo;card.appendChild(im)}
   var b=document.createElement("button");b.type="button";b.className="main";b.setAttribute("aria-pressed",it.done?"true":"false");
   var em=document.createElement("span");em.className="emoji";em.textContent=it.emoji||GEMO[it.group]||"💡";
   var t=document.createElement("span");t.className="txt";
   var n=document.createElement("span");n.className="name";n.textContent=it.name||"";t.appendChild(n);
   if(it.desc){var d=document.createElement("span");d.className="desc";d.textContent=it.desc;t.appendChild(d)}
   if(it.tag){var tg=document.createElement("span");tg.className="tag";tg.textContent=it.tag;t.appendChild(tg)}
   var bx=document.createElement("span");bx.className="box";bx.textContent="✓";
   b.appendChild(em);b.appendChild(t);b.appendChild(bx);b.onclick=function(){toggle(it)};card.appendChild(b);
   var ac=document.createElement("div");ac.className="acts";
   var a=document.createElement("a");a.href=mapUrl(it.q||it.tag||it.name);a.target="_blank";a.rel="noopener";a.textContent="📍 Voir sur la carte";ac.appendChild(a);
   var p=document.createElement("button");p.type="button";p.textContent=it.photo?"📷 Changer la photo":"📷 Ajouter une photo";p.onclick=function(){pickPhoto(it)};ac.appendChild(p);
   var x=document.createElement("button");x.type="button";x.textContent="🗑 Supprimer";x.onclick=function(){if(confirm("Supprimer « "+(it.name||"")+" » ?")){items=items.filter(function(y){return y.id!==it.id});save()}};ac.appendChild(x);
   card.appendChild(ac);sec.appendChild(card);
  });
  host.appendChild(sec);
 });
}
$("addbtn").onclick=function(){var f=$("form");f.style.display=f.style.display==="block"?"none":"block";if(f.style.display==="block")$("f-name").focus()};
$("f-cancel").onclick=function(){$("form").style.display="none"};
$("f-ok").onclick=function(){
 var name=$("f-name").value.trim();if(!name){$("f-name").focus();return}
 var g=$("f-group").value,place=$("f-place").value.trim(),emo=$("f-emoji").value.trim()||autoEmoji(name+" "+place,g);
 var data={id:uid(),group:g,order:Date.now(),emoji:emo,name:name,desc:$("f-note").value.trim(),tag:place,q:place?(name+" "+place):name,done:false};
 var file=$("f-photo").files[0];$("f-ok").disabled=true;
 function fin(){items.push(data);save();["f-name","f-emoji","f-place","f-note","f-photo"].forEach(function(k){$(k).value=""});$("form").style.display="none";$("f-ok").disabled=false}
 if(file){resize(file).then(function(d){if(d)data.photo=d;fin()})}else fin();
};
$("reset").onclick=function(){if(confirm("Tout décocher ?")){items.forEach(function(x){x.done=false});save()}};
$("share").onclick=function(){
 var slim=items.map(function(x){var o={};for(var k in x){if(k!=="photo")o[k]=x[k]}return o});
 var link=location.href.split("#")[0]+"#d="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(slim)))));
 if(navigator.share){navigator.share({title:"Vacances à Bordeaux",url:link}).catch(function(){})}
 else if(navigator.clipboard){navigator.clipboard.writeText(link).then(function(){alert("Lien copié !")})}
 else{prompt("Copie ce lien :",link)}
};
(function(){
 var h=location.hash;if(h.indexOf("#d=")!==0)return;
 try{
  var shared=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h.slice(3))))));
  if(confirm("Fusionner la liste reçue avec la tienne ?")){
   shared.forEach(function(s){var o=items.filter(function(x){return x.id===s.id})[0];if(o){o.done=o.done||s.done}else{items.push(s)}});
   save();
  }
 }catch(e){}
 history.replaceState(null,"",location.pathname);
})();
render();
</script>
</body>
</html>
